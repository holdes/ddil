# ==========================================================================
#  PiSat GSW -> Elastic  (Logstash pipeline)
#
#  Ships the decoded Zeek CCSDS command + telemetry, the Zeek conn.log, and the
#  access-portal auth log into the Elastic wired stream `logs.ecs`. Filebeat
#  stamps `pipeline_source` per lane (see filebeat-pisat-inputs.yml); this pipeline
#  normalizes each lane to the schema the analytics read, then outputs.
#
#  What "normalize" means: the analytics read NORMALIZED fields (command.name,
#  cs.checksumState, hs.cpuHogState, message, user.name, source.ip) — never the raw
#  Zeek field names — so they don't break if the vendor feed changes. This pipeline
#  is where that translation happens: it sets event.dataset from the packet (which
#  routes the doc to the right partition), renames raw fields, and decodes the
#  integer enums to their labels using the dictionaries in ./dictionaries/ (those
#  are generated from the flight-software source, so the values are grounded).
#
#  Install: see README in this folder. Fill in ELASTIC_HOST + the API key (Elastic
#  team provides them) and the dictionary path (DICT_DIR) below.
# ==========================================================================

input {
  beats { port => 5044 }
}

filter {
  # Source activity time. Blake's decoded feed carries `ts` as UNIX epoch; older
  # builds used ISO8601 — match both. (conn.log ships raw; this no-ops for it.)
  date { match => ["ts", "UNIX", "ISO8601"] target => "@timestamp" }

  # ---- Zeek CCSDS lane -> commands + telemetry --------------------------------
  # The real Filebeat ships BOTH ccsds_commands.log and ccsds_telemetry.log under ONE
  # input (pipeline_source "zeek-ccsds"). Split by CONTENT: a COMMAND record carries
  # `command_name`; a TELEMETRY record carries `packet_name`.
  if [pipeline_source] == "zeek-ccsds" {

    # ---- COMMAND -> space.command ----
    if [command_name] {
    mutate {
      rename => {
        "src_ip"        => "[source][ip]"
        "src_port"      => "[source][port]"
        "dst_ip"        => "[destination][ip]"
        "dst_port"      => "[destination][port]"
        "target"        => "target_name"
        "command_name"  => "packet_name"
        "function_code" => "CCSDS_FC"
        "stream_id"     => "CCSDS_STREAMID"
        "raw_hex"       => "[event][original]"
      }
      add_field => { "[event][module]" => "cosmos" "[event][dataset]" => "space.command"
                     "[command][name]" => "%{packet_name}" "[command][opcode]" => "%{CCSDS_FC}" }
      remove_field => ["uid", "stream_id_hex", "apid", "sequence_flags",
                       "packet_sequence", "data_length", "checksum",
                       "command_desc", "packet_length", "valid"]
    }
    # command.name/opcode are set here (not left to the core chain, which needs enrich
    # keys the pisat feed lacks) so the hazardous-command LOOKUP JOIN fires on live data.
    mutate { convert => { "[command][opcode]" => "integer" } }
    # the core commands chain derives command.name<-packet_name, command.opcode<-CCSDS_FC

    # Commands are NOT attributed to an operator at ingest. The COSMOS console is ONE
    # shared entity that every attendee drives, and the portal registration log does not
    # deterministically map to a specific command — so there is no reliable ingest-time
    # join. Attribution is done at QUERY time by the AI agent, which references the indexed
    # portal registration log (logs-pisat-portal, see the portal lane below) as context
    # (e.g. "the most recently registered user"). The command lane just ships the
    # wire-native command as-is; source.ip (portal host vs. a rogue injector) is retained
    # as additional context for that reasoning.
    }

    # ---- TELEMETRY -> space.memory / .health / .events ----
    else if [packet_name] {
    # event.dataset from the packet identity = "the data source defines event.dataset".
    # Decoded state packets route to the wired-stream partitions; every OTHER packet
    # (numeric-gauge housekeeping: EPS/CAMERA/STPYLD/SYSMON/…) gets "space.telemetry" and
    # lands in the logs-pisat-telemetry index — nothing is dropped.
    translate {
      source      => "packet_name"
      target      => "[event][dataset]"
      dictionary  => {
        "CS_HKPACKET"         => "space.memory"
        "MM_HKPACKET"         => "space.memory"
        "HS_HKPACKET"         => "space.health"
        "SPACECOP_REPORT_TLM" => "space.events"
      }
      fallback    => "space.telemetry"
    }
    mutate { add_field => { "[event][module]" => "cosmos" } }

    # Checksum (integrity) -> cs.*  (enum: CS ChecksumState)
    if [packet_name] == "CS_HKPACKET" {
      mutate { add_field => { "fswApp" => "CS" "subtype" => "CS_HK" } }
      translate { source => "[parameters.CHECKSUMSTATE]"  target => "[cs][checksumState]" dictionary_path => "${DICT_DIR}/cs_state.json" }
      translate { source => "[parameters.EEPROMCSSTATE]"  target => "[cs][eepromState]"   dictionary_path => "${DICT_DIR}/cs_state.json" }
      translate { source => "[parameters.MEMORYCSSTATE]"  target => "[cs][memoryState]"   dictionary_path => "${DICT_DIR}/cs_state.json" }
    }
    # Health & Safety (CPU hog) -> hs.*  (enum: HS State — opposite polarity to CS)
    else if [packet_name] == "HS_HKPACKET" {
      mutate { add_field => { "fswApp" => "HS" "subtype" => "HS_HK" } }
      translate { source => "[parameters.CURRENTCPUHOGSTATE]" target => "[hs][cpuHogState]"  dictionary_path => "${DICT_DIR}/hs_state.json" }
      mutate { rename => { "[parameters.STATUSFLAGS]" => "[hs][statusFlags]" } }
    }
    # Memory Manager (poke/peek) -> mm.*  (enum: MM LastAction / MemType)
    else if [packet_name] == "MM_HKPACKET" {
      mutate { add_field => { "fswApp" => "MM" } }
      translate { source => "[parameters.LASTACTION]" target => "[mm][lastAction]" dictionary_path => "${DICT_DIR}/mm_lastaction.json" }
      translate { source => "[parameters.MEMTYPE]"    target => "[mm][memType]"    dictionary_path => "${DICT_DIR}/mm_memtype.json" }
      mutate { rename => { "[parameters.ADDRESS]" => "[mm][address]" "[parameters.DATAVALUE]" => "[mm][dataValue]" } }
      # subtype = MM_<action> so the core memory rule (subtype == "MM_POKE") fires
      mutate { add_field => { "subtype" => "MM_%{[mm][lastAction]}" } }
    }
    # On-board IDS (SPACECOP) -> space.events, IDS_MSG -> ECS message
    else if [packet_name] == "SPACECOP_REPORT_TLM" {
      mutate {
        add_field => { "target_name" => "SPACECOP" "PACKETID_EVENTTYPE" => "4" }
        rename    => { "[parameters.IDS_MSG]" => "message" }
      }
    }

    # Type the numeric telemetry parameters (voltages, currents, CPU util, counts, resets)
    # as numbers so ML anomaly jobs can model them. Decoded enum codes convert harmlessly;
    # non-numeric params (IDS_MSG, hex addresses) are left as strings.
    ruby {
      code => '
        event.to_hash.each do |k, v|
          next unless k.start_with?("parameters.") && v.is_a?(String)
          if v =~ /\A-?\d+\z/
            event.set(k, v.to_i)
          elsif v =~ /\A-?\d*\.\d+\z/
            event.set(k, v.to_f)
          end
        end
      '
    }
    }
  }

  # ---- Access-portal auth lane -> portal.auth (ECS authentication) --------------
  else if [pipeline_source] == "pisat-portal" {
    # The raw portal log carries a scalar `event` ("REGISTER"/"LOGIN") that duplicates
    # `action`. Remove it FIRST (its own mutate, so it runs before the add_field below):
    # otherwise the scalar collides with the ECS `event` OBJECT we build — Logstash can't
    # set [event][category] on a string, and the string `event` conflicts with the index's
    # object mapping, so the document is rejected and never lands.
    mutate { remove_field => ["event"] }
    mutate {
      rename    => { "email" => "[user][name]" "ip" => "[source][ip]" "service" => "[service][name]" }
      lowercase => ["action"]
      add_field => { "[event][dataset]" => "portal.auth"
                     "[event][kind]" => "event" "[event][category]" => "authentication" }
    }
    if [action] == "login" {
      mutate { add_field => { "[event][type]" => "start" "[event][action]" => "login" } }
    } else if [action] == "register" {
      mutate { add_field => { "[event][type]" => "user" "[event][action]" => "register" } }
    }
  }

}

output {
  # Numeric telemetry store: EVERY telemetry packet lands here (nothing dropped), with
  # parameters.* typed as numbers so ML anomaly jobs can model it. The decoded state
  # packets (memory/health) ALSO route to the wired stream below for the effect rules.
  if [pipeline_source] == "zeek-ccsds" and [event][dataset] in ["space.memory", "space.health", "space.telemetry"] {
    elasticsearch {
      hosts => ["https://ELASTIC_HOST:9200"]
      api_key => "API_KEY_ID:API_KEY_SECRET"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "logs-pisat-telemetry"
      action => "create"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }

  # Access-portal registration log -> its own IT/identity index (the AI agent's
  # attribution context). NOT the space-segment wired stream.
  if [pipeline_source] == "pisat-portal" {
    elasticsearch {
      hosts => ["https://ELASTIC_HOST:9200"]
      api_key => "API_KEY_ID:API_KEY_SECRET"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "logs-pisat-portal"
      action => "create"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }
  # Zeek conn.log -> the Elastic Zeek integration stream (auto-parsed to full ECS).
  else if [pipeline_source] == "zeek-conn" {
    elasticsearch {
      hosts => ["https://ELASTIC_HOST:9200"]
      api_key => "API_KEY_ID:API_KEY_SECRET"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "logs-zeek.connection-default"
      action => "create"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }
  # decoded command + state telemetry -> the wired stream (Streams routes by event.dataset)
  else if [event][dataset] in ["space.command", "space.memory", "space.health", "space.events"] {
    elasticsearch {
      hosts => ["https://ELASTIC_HOST:9200"]
      api_key => "API_KEY_ID:API_KEY_SECRET"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "logs.ecs"
      action => "create"      # required — the wired stream only accepts create ops
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }
}
